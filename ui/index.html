<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c0e;--surface:#141416;--surface-hover:#1a1a1e;--border:#232326;--border-focus:#4a4a52;--text:#f0eff4;--text-2:#8b8a93;--text-3:#5c5b63;--accent:#6366f1;--accent-hover:#818cf8;--success:#22c55e;--radius:12px;--radius-sm:8px}
body{font-family:"Inter",-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:680px;margin:0 auto;padding:80px 24px 40px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:64px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:15px;font-weight:600;letter-spacing:-0.02em}
.logo-settings{margin-right:auto;background:none;border:none;color:var(--text-3);cursor:pointer;font-size:18px;padding:6px;border-radius:6px;transition:all .2s}
.logo-settings:hover{color:var(--text);background:var(--surface)}
.hero{margin-bottom:48px}
.hero h1{font-size:32px;font-weight:700;letter-spacing:-0.03em;line-height:1.2;margin-bottom:12px}
.hero p{font-size:15px;color:var(--text-2);line-height:1.6}
.forge-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s ease}
.forge-box:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 4px rgba(99,102,241,0.08)}
.forge-box textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:15px;line-height:1.6;padding:20px;resize:none;min-height:120px}
.forge-box textarea::placeholder{color:var(--text-3)}
.forge-actions{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border)}
.forge-hint{font-size:12px;color:var(--text-3)}
.forge-btn{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.forge-btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.forge-btn:active{transform:translateY(0)}
.forge-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.progress{margin-top:32px;display:none}
.progress.show{display:block}
.progress-bars{display:flex;gap:2px;margin-bottom:12px}
.pbar{flex:1;height:3px;background:var(--border);border-radius:2px;transition:all .5s}
.pbar.done{background:var(--success)}
.pbar.active{background:var(--accent)}
.progress-label{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:32px;display:none}
.result.show{display:block}
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.result-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.result-actions{display:flex;gap:6px}
.result-actions button{background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:6px 12px;border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s}
.result-actions button:hover{color:var(--text);border-color:var(--border-focus)}
.code-display{background:#0a0a0c;border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-height:500px;overflow:auto;direction:ltr;text-align:left}
.code-display pre{font-family:"JetBrains Mono","Fira Code",monospace;font-size:13px;line-height:1.7;color:#e2e8f0;white-space:pre-wrap;word-break:break-word}
.preview{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:none}
.preview.show{display:block}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2)}
.preview iframe{width:100%;height:400px;border:none;background:#fff}
.iterate{margin-top:16px;display:none}
.iterate.show{display:flex;gap:8px}
.iterate input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.iterate input:focus{border-color:var(--border-focus)}
.iterate button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
.iterate button:hover{border-color:var(--border-focus)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:420px}
.modal h2{font-size:18px;font-weight:700;margin-bottom:24px}
.modal label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;margin-top:16px}
.modal input,.modal select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--border-focus)}
.modal-save{width:100%;margin-top:24px;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.modal-close{width:100%;margin-top:8px;background:none;border:1px solid var(--border);color:var(--text-2);padding:12px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface);border:1px solid var(--border);padding:12px 24px;border-radius:var(--radius-sm);font-size:13px;color:var(--text);z-index:200;transition:transform .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
.footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);text-align:center}
@media(max-width:640px){.container{padding:48px 16px 24px}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="container">
  <div class="logo"><div class="logo-mark">⚡</div><span class="logo-text">PromptForge</span><button class="logo-settings" onclick="openSettings()">⚙️</button></div>
  <div class="hero"><h1>מה אתה רוצה לבנות?</h1><p>תאר את המשימה. תקבל תוכנית פעולה וקוד עובד תוך שניות.</p></div>
  <div class="forge-box">
    <textarea id="task" placeholder="למשל: משחק snake עם ניקוד, רמות, ואנימציות חלקות..." rows="4"></textarea>
    <div class="forge-actions"><span class="forge-hint">Enter לשליחה · Shift+Enter לשורה חדשה</span><button class="forge-btn" id="forgeBtn" onclick="forge()"><span>→</span><span id="forgeBtnText">בנה</span></button></div>
  </div>
  <div class="progress" id="progress">
    <div class="progress-bars"><div class="pbar" id="pb1"></div><div class="pbar" id="pb2"></div><div class="pbar" id="pb3"></div><div class="pbar" id="pb4"></div></div>
    <div class="progress-label"><div class="spinner" id="spinner"></div><span id="progressText">מנתח את המשימה...</span></div>
  </div>
  <div class="result" id="result">
    <div class="result-header"><div class="result-title">✨ הקוד מוכן</div><div class="result-actions"><button onclick="copyCode()">העתק</button><button onclick="downloadCode()">הורד</button><button onclick="togglePreview()">תצוגה</button><button onclick="toggleIterate()">שפר</button></div></div>
    <div class="code-display"><pre id="codeOut"></pre></div>
    <div class="preview" id="preview"><div class="preview-header"><span>Live Preview</span><button onclick="togglePreview()" style="background:none;border:none;color:var(--text-2);cursor:pointer">✕</button></div><iframe id="previewFrame" sandbox="allow-scripts"></iframe></div>
    <div class="iterate" id="iterateBox"><input id="iterateInput" placeholder="מה לשפר? למשל: תוסיף dark mode"><button onclick="iterate()">שפר</button></div>
  </div>
  <div class="footer">PromptForge — מ-task לקוד עובד</div>
</div>
<div class="modal-backdrop" id="settingsModal">
  <div class="modal"><h2>הגדרות</h2><label>NVIDIA API Key</label><input type="password" id="apiKeyInput" placeholder="nvapi-..."><label>מודל</label><select id="modelSelect"><option value="meta/llama-3.3-70b-instruct">Llama 3.3 70B</option><option value="meta/llama-3.1-8b-instruct">Llama 3.1 8B (מהיר)</option><option value="deepseek-ai/deepseek-coder-6.7b-instruct">DeepSeek Coder</option><option value="mistralai/codestral-22b-instruct-v0.1">Codestral 22B</option></select><button class="modal-save" onclick="saveSettings()">שמור</button><button class="modal-close" onclick="closeSettings()">סגור</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
var GW="https://promptforge.rabotatony.workers.dev";
var code="",building=false;
function getKey(){return localStorage.getItem("pf_key")||""}
function getModel(){return localStorage.getItem("pf_model")||"meta/llama-3.3-70b-instruct"}
function openSettings(){document.getElementById("apiKeyInput").value=getKey();document.getElementById("modelSelect").value=getModel();document.getElementById("settingsModal").classList.add("show")}
function closeSettings(){document.getElementById("settingsModal").classList.remove("show")}
function saveSettings(){var k=document.getElementById("apiKeyInput").value.trim();var m=document.getElementById("modelSelect").value;if(k)localStorage.setItem("pf_key",k);localStorage.setItem("pf_model",m);closeSettings();toast("✅ נשמר")}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2500)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function setProgress(step,text){for(var i=1;i<=4;i++){var bar=document.getElementById("pb"+i);bar.className="pbar"+(i<step?" done":i===step?" active":"")}document.getElementById("progressText").textContent=text}
document.getElementById("task").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();forge()}})
async function forge(){
  var task=document.getElementById("task").value.trim();
  if(!task){toast("כתוב מה אתה רוצה לבנות");return}
  var key=getKey();
  if(!key){openSettings();toast("הכנס API key בהגדרות");return}
  if(building)return;
  building=true;
  document.getElementById("forgeBtn").disabled=true;
  document.getElementById("forgeBtnText").textContent="בונה...";
  document.getElementById("progress").classList.add("show");
  document.getElementById("result").classList.remove("show");
  try{
    setProgress(1,"מנתח את המשימה...");
    var pr=await fetch(GW+"/api/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,apiKey:key})});
    var pd=await pr.json();
    if(pd.error){toast("❌ "+pd.error);reset();return}
    setProgress(2,"מתכנן ארכיטקטורה...");
    await sleep(300);
    setProgress(3,"כותב קוד...");
    var br=await fetch(GW+"/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,plan:pd.plan||"",apiKey:key})});
    var bd=await br.json();
    if(bd.error){toast("❌ "+bd.error);reset();return}
    code=bd.code||"";
    setProgress(4,"בודק...");
    await sleep(300);
    document.getElementById("progress").classList.remove("show");
    document.getElementById("codeOut").textContent=code;
    document.getElementById("result").classList.add("show");
    if(code.indexOf("<!DOCTYPE")!==-1||code.indexOf("<html")!==-1){document.getElementById("preview").classList.add("show");document.getElementById("previewFrame").srcdoc=code}
    toast("✨ מוכן");
  }catch(e){toast("❌ "+e.message)}
  reset();
}
function reset(){building=false;document.getElementById("forgeBtn").disabled=false;document.getElementById("forgeBtnText").textContent="בנה"}
function copyCode(){navigator.clipboard.writeText(code).then(function(){toast("📋 הועתק")})}
function downloadCode(){var ext=code.indexOf("<html")!==-1?"html":"js";var b=new Blob([code],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="output."+ext;a.click();toast("💾 ירד")}
function togglePreview(){var p=document.getElementById("preview");p.classList.toggle("show");if(p.classList.contains("show"))document.getElementById("previewFrame").srcdoc=code}
function toggleIterate(){document.getElementById("iterateBox").classList.toggle("show")}
async function iterate(){
  var instruction=document.getElementById("iterateInput").value.trim();
  if(!instruction){toast("כתוב מה לשפר");return}
  var key=getKey();if(!key||!code)return;
  toast("⏳ משפר...");
  try{
    var r=await fetch(GW+"/api/iterate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,instruction:instruction,apiKey:key})});
    var d=await r.json();
    if(d.error){toast("❌ "+d.error);return}
    code=d.code||"";
    document.getElementById("codeOut").textContent=code;
    if(code.indexOf("<!DOCTYPE")!==-1||code.indexOf("<html")!==-1){document.getElementById("previewFrame").srcdoc=code}
    document.getElementById("iterateInput").value="";
    toast("✅ שופר");
  }catch(e){toast("❌ "+e.message)}
}
if(!getKey())setTimeout(function(){toast("⚙️ לחץ על הגלגל למעלה והכנס API key")},1000);
</script>
</body>
</html>
