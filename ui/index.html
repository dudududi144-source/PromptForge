<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a;--surface:#111114;--surface2:#1a1a1f;
  --border:#222228;--text:#e8e6e3;--text2:#8a8890;
  --fire:#e8722a;--fire2:#f59e0b;--ember:#ff4d00;
  --glow:rgba(232,114,42,0.15);--success:#34d399;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(232,114,42,0.06),transparent 70%);transition:all 1.5s}
body.building .ambient{background:radial-gradient(ellipse 80% 50% at 50% 30%,rgba(232,114,42,0.12),transparent 70%)}
.wrap{max-width:720px;margin:0 auto;padding:40px 24px;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:60px}
.logo .name{font-size:1.1rem;font-weight:700;
  background:linear-gradient(135deg,var(--fire),var(--fire2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo .settings{margin-right:auto;background:none;border:none;color:var(--text2);
  cursor:pointer;font-size:1.1rem;padding:8px;border-radius:8px;transition:all .2s}
.logo .settings:hover{color:var(--text);background:var(--surface)}
.hero{text-align:center;margin-bottom:48px}
.hero h1{font-size:2.8rem;font-weight:800;letter-spacing:-0.03em;line-height:1.15;margin-bottom:14px}
.hero h1 span{background:linear-gradient(135deg,var(--fire),var(--fire2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--text2);font-size:1.05rem;font-weight:300}
.forge-input{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:4px;transition:all .3s;box-shadow:0 0 0 0 var(--glow)}
.forge-input:focus-within{border-color:rgba(232,114,42,0.4);box-shadow:0 0 40px 0 var(--glow)}
.forge-input textarea{width:100%;background:none;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:1.05rem;padding:16px 18px;resize:none;min-height:80px;line-height:1.6}
.forge-input textarea::placeholder{color:#55535a}
.forge-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--border)}
.forge-bar .hint{font-size:.8rem;color:var(--text2)}
.forge-btn{display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--fire),var(--ember));color:#fff;border:none;
  padding:10px 28px;border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:all .25s;box-shadow:0 2px 12px rgba(232,114,42,0.3)}
.forge-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(232,114,42,0.4)}
.forge-btn:disabled{opacity:.5;cursor:wait;transform:none}
.process{margin-top:32px;display:none}
.process.show{display:block;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.step{display:flex;align-items:flex-start;gap:14px;padding:14px 0;
  opacity:0;transform:translateY(8px);transition:all .4s ease}
.step.visible{opacity:1;transform:translateY(0)}
.step .dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:.75rem;
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);transition:all .4s}
.step.active .dot{background:var(--glow);border-color:var(--fire);color:var(--fire);box-shadow:0 0 12px var(--glow)}
.step.done .dot{background:rgba(52,211,153,0.1);border-color:var(--success);color:var(--success)}
.step .title{font-size:.9rem;font-weight:600;margin-bottom:2px}
.step .desc{font-size:.8rem;color:var(--text2);line-height:1.5}
.step.active .title{color:var(--fire)}
.result{margin-top:32px;display:none}
.result.show{display:block;animation:fadeUp .5s ease}
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.result-header h3{font-size:1rem;font-weight:600}
.result-actions{display:flex;gap:8px}
.result-actions button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:6px 14px;border-radius:8px;font-family:inherit;font-size:.8rem;cursor:pointer;transition:all .2s}
.result-actions button:hover{color:var(--text);border-color:var(--text2)}
.code-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:20px;max-height:500px;overflow:auto;direction:ltr;text-align:left}
.code-block pre{font-family:'Cascadia Code','Fira Code',monospace;font-size:.82rem;
  line-height:1.7;color:#c9d1d9;white-space:pre-wrap;word-break:break-word}
.preview-frame{margin-top:16px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}
.preview-frame iframe{width:100%;height:400px;border:none}
.preview-label{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;
  background:var(--surface);border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:28px;width:90%;max-width:440px;animation:fadeUp .3s ease}
.modal h3{font-size:1.1rem;font-weight:700;margin-bottom:20px}
.modal label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px;margin-top:16px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none}
.modal input:focus{border-color:var(--fire)}
.modal .save-btn{width:100%;margin-top:24px;background:linear-gradient(135deg,var(--fire),var(--ember));
  color:#fff;border:none;padding:12px;border-radius:10px;font-family:inherit;font-size:.95rem;
  font-weight:600;cursor:pointer}
.modal .close-btn{width:100%;margin-top:8px;background:none;border:1px solid var(--border);
  color:var(--text2);padding:10px;border-radius:10px;font-family:inherit;font-size:.9rem;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--border);padding:10px 20px;border-radius:10px;
  font-size:.85rem;color:var(--text);z-index:200;transition:all .3s;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.hero h1{font-size:2rem}.wrap{padding:24px 16px}}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="wrap">
  <div class="logo">
    <span>🔥</span>
    <span class="name">PromptForge</span>
    <button class="settings" onclick="openSettings()">⚙️</button>
  </div>
  <div class="hero">
    <h1>מה אתה רוצה <span>לבנות</span>?</h1>
    <p>כתוב. לחץ. קבל קוד עובד.</p>
  </div>
  <div class="forge-input">
    <textarea id="mission" placeholder="למשל: משחק snake עם ניקוד, רמות, ואנימציות חלקות..." rows="3"></textarea>
    <div class="forge-bar">
      <span class="hint">Enter לשליחה</span>
      <button class="forge-btn" id="forgeBtn" onclick="forge()">
        <span>🔥</span><span id="forgeBtnText">צור</span>
      </button>
    </div>
  </div>
  <div class="process" id="process">
    <div class="step" id="step1"><div class="dot">1</div>
      <div class="info"><div class="title">מנתח את המשימה</div><div class="desc" id="step1desc"></div></div></div>
    <div class="step" id="step2"><div class="dot">2</div>
      <div class="info"><div class="title">מתכנן ארכיטקטורה</div><div class="desc" id="step2desc"></div></div></div>
    <div class="step" id="step3"><div class="dot">3</div>
      <div class="info"><div class="title">בונה את הקוד</div><div class="desc" id="step3desc"></div></div></div>
    <div class="step" id="step4"><div class="dot">4</div>
      <div class="info"><div class="title">בודק ומלטש</div><div class="desc" id="step4desc"></div></div></div>
  </div>
  <div class="result" id="result">
    <div class="result-header">
      <h3>✨ מוכן</h3>
      <div class="result-actions">
        <button onclick="copyCode()">📋 העתק</button>
        <button onclick="downloadCode()">💾 הורד</button>
        <button onclick="togglePreview()">👁️ תצוגה</button>
      </div>
    </div>
    <div class="code-block"><pre id="codeOutput"></pre></div>
    <div class="preview-frame" id="previewFrame" style="display:none">
      <div class="preview-label"><span>Live Preview</span>
        <button onclick="togglePreview()" style="background:none;border:none;color:var(--text2);cursor:pointer">✕</button></div>
      <iframe id="previewIframe" sandbox="allow-scripts"></iframe>
    </div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ הגדרות</h3>
    <label>NVIDIA API Key</label>
    <input type="password" id="apiKeyInput" placeholder="nvapi-...">
    <label>מודל</label>
    <input type="text" id="modelInput" value="meta/llama-3.3-70b-instruct">
    <button class="save-btn" onclick="saveSettings()">שמור</button>
    <button class="close-btn" onclick="closeSettings()">סגור</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const GW='https://promptforge-gateway.rabotatony.workers.dev';
let generatedCode='',isBuilding=false;
function getKey(){return localStorage.getItem('pf_key')||''}
function getModel(){return localStorage.getItem('pf_model')||'meta/llama-3.3-70b-instruct'}
function openSettings(){document.getElementById('apiKeyInput').value=getKey();
  document.getElementById('modelInput').value=getModel();
  document.getElementById('settingsModal').classList.add('show')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('show')}
function saveSettings(){const k=document.getElementById('apiKeyInput').value.trim();
  const m=document.getElementById('modelInput').value.trim();
  if(k)localStorage.setItem('pf_key',k);if(m)localStorage.setItem('pf_model',m);
  closeSettings();showToast('✅ נשמר')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function setStep(n,state){document.getElementById('step'+n).className='step visible '+state}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
document.getElementById('mission').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();forge()}});
async function forge(){
  const mission=document.getElementById('mission').value.trim();
  if(!mission){showToast('כתוב מה אתה רוצה לבנות');return}
  const key=getKey();
  if(!key){openSettings();showToast('הכנס API key');return}
  if(isBuilding)return;
  isBuilding=true;document.body.classList.add('building');
  document.getElementById('forgeBtn').disabled=true;
  document.getElementById('forgeBtnText').textContent='בונה...';
  document.getElementById('process').classList.add('show');
  document.getElementById('result').classList.remove('show');
  ['step1','step2','step3','step4'].forEach(function(s){
    document.getElementById(s).className='step';
  });
  try{
    setStep(1,'active');
    try{const ar=await fetch(GW+'/api/analyze-mission',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:mission})});
      const ad=await ar.json();
      if(ad.analysis)document.getElementById('step1desc').textContent=
        'סיבוכות: '+ad.analysis.complexity+' · זמן: '+ad.analysis.estimatedBuildTime;
      else document.getElementById('step1desc').textContent='מנתח...';
    }catch(e){document.getElementById('step1desc').textContent='מנתח...'}
    setStep(1,'done');
    setStep(2,'active');await sleep(600);
    document.getElementById('step2desc').textContent='HTML + CSS + JS · קוד עצמאי · ללא תלויות';
    setStep(2,'done');
    setStep(3,'active');
    const gr=await fetch(GW+'/api/generate',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({goal:mission,apiKey:key,model:getModel()})});
    const gd=await gr.json();
    if(gd.error){document.getElementById('step3desc').textContent='❌ '+gd.error;
      showToast('❌ '+gd.error);resetBtn();return}
    generatedCode=gd.code||'';
    document.getElementById('step3desc').textContent=
      generatedCode.split('\n').length+' שורות · '+(gd.total_tokens||0)+' tokens';
    setStep(3,'done');
    setStep(4,'active');await sleep(500);
    var vt='✅ תקין';
    if(gd.validation&&!gd.validation.valid)vt='⚠️ '+(gd.validation.issues||[]).join(', ');
    if(gd.suggestions&&gd.suggestions.length)vt+=' · '+gd.suggestions.length+' הצעות';
    document.getElementById('step4desc').textContent=vt;
    setStep(4,'done');
    await sleep(300);
    document.getElementById('codeOutput').textContent=generatedCode;
    document.getElementById('result').classList.add('show');
    if(generatedCode.includes('<!DOCTYPE')||generatedCode.includes('<html')){
      document.getElementById('previewFrame').style.display='block';
      document.getElementById('previewIframe').srcdoc=generatedCode}
    showToast('✨ מוכן!');
  }catch(e){showToast('❌ '+e.message)}
  resetBtn();
}
function resetBtn(){isBuilding=false;document.body.classList.remove('building');
  document.getElementById('forgeBtn').disabled=false;
  document.getElementById('forgeBtnText').textContent='צור'}
function copyCode(){navigator.clipboard.writeText(generatedCode).then(function(){showToast('📋 הועתק!')})}
function downloadCode(){var ext=generatedCode.includes('<html')?'html':'js';
  var b=new Blob([generatedCode],{type:'text/plain'});var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='output.'+ext;a.click();showToast('💾 ירד!')}
function togglePreview(){var f=document.getElementById('previewFrame');
  if(f.style.display==='none'){f.style.display='block';
    document.getElementById('previewIframe').srcdoc=generatedCode}
  else f.style.display='none'}
if(!getKey())setTimeout(function(){showToast('⚙️ לחץ על הגלגל והכנס API key')},1500);
</script>
</body>
</html>
