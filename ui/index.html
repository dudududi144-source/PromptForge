<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0f;color:#e8e6f0;min-height:100vh}
.container{max-width:700px;margin:0 auto;padding:60px 20px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:48px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:15px;font-weight:600}
.settings-btn{margin-right:auto;background:none;border:none;color:#5c5b63;cursor:pointer;font-size:18px;padding:6px}
.settings-btn:hover{color:#e8e6f0}
h1{font-size:28px;font-weight:700;margin-bottom:8px}
.subtitle{font-size:14px;color:#8b8a93;margin-bottom:32px}
.input-box{background:#141416;border:1px solid #232326;border-radius:12px;overflow:hidden}
.input-box:focus-within{border-color:#4a4a52}
.input-box textarea{width:100%;background:transparent;border:none;outline:none;color:#e8e6f0;font-family:inherit;font-size:15px;padding:16px;resize:none;min-height:100px;line-height:1.6}
.input-box textarea::placeholder{color:#5c5b63}
.input-actions{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #232326}
.hint{font-size:11px;color:#5c5b63}
.build-btn{background:#6366f1;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.build-btn:hover{background:#818cf8}
.build-btn:disabled{opacity:.5;cursor:not-allowed}
.progress{margin-top:24px;display:none}
.progress.show{display:block}
.progress-bars{display:flex;gap:2px;margin-bottom:10px}
.pbar{flex:1;height:3px;background:#232326;border-radius:2px}
.pbar.done{background:#22c55e}
.pbar.active{background:#6366f1}
.progress-text{font-size:12px;color:#8b8a93}
.result{margin-top:24px;display:none}
.result.show{display:block}
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.result-title{font-size:13px;font-weight:600}
.result-actions{display:flex;gap:4px}
.result-actions button{background:#141416;border:1px solid #232326;color:#8b8a93;padding:5px 10px;border-radius:6px;font-family:inherit;font-size:11px;cursor:pointer}
.result-actions button:hover{color:#e8e6f0;border-color:#4a4a52}
.code-box{background:#0a0a0c;border:1px solid #232326;border-radius:12px;padding:16px;max-height:400px;overflow:auto;direction:ltr;text-align:left}
.code-box pre{font-family:"JetBrains Mono","Fira Code",monospace;font-size:12px;line-height:1.7;color:#e2e8f0;white-space:pre-wrap;word-break:break-word}
.preview{margin-top:10px;border:1px solid #232326;border-radius:12px;overflow:hidden;display:none}
.preview.show{display:block}
.preview iframe{width:100%;height:350px;border:none;background:#fff}
.iterate-box{margin-top:12px;display:none;gap:6px}
.iterate-box.show{display:flex}
.iterate-box input{flex:1;background:#141416;border:1px solid #232326;border-radius:8px;padding:8px 12px;color:#e8e6f0;font-family:inherit;font-size:13px;outline:none}
.iterate-box button{background:#141416;border:1px solid #232326;color:#e8e6f0;padding:8px 16px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer}
.templates{margin-top:20px;display:flex;gap:6px;flex-wrap:wrap}
.tpl-btn{background:#141416;border:1px solid #232326;color:#8b8a93;padding:6px 12px;border-radius:6px;font-family:inherit;font-size:11px;cursor:pointer}
.tpl-btn:hover{color:#e8e6f0;border-color:#4a4a52}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#141416;border:1px solid #232326;border-radius:16px;padding:24px;width:90%;max-width:400px}
.modal h2{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#8b8a93;margin-bottom:4px;margin-top:12px}
.modal input,.modal select{width:100%;background:#0a0a0f;border:1px solid #232326;border-radius:8px;padding:8px 12px;color:#e8e6f0;font-family:inherit;font-size:13px;outline:none}
.modal-save{width:100%;margin-top:16px;background:#6366f1;color:#fff;border:none;padding:10px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.modal-close{width:100%;margin-top:6px;background:none;border:1px solid #232326;color:#8b8a93;padding:10px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1e;border:1px solid #3a3a42;padding:10px 20px;border-radius:8px;font-size:12px;z-index:200;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="container">
<div class="logo"><div class="logo-icon">⚡</div><span class="logo-text">PromptForge</span><button class="settings-btn" onclick="openSettings()">⚙️</button></div>
<h1>מה אתה רוצה לבנות?</h1>
<p class="subtitle">תאר את המשימה. תקבל תוכנית וקוד עובד תוך שניות.</p>
<div class="input-box">
<textarea id="task" placeholder="למשל: משחק snake עם ניקוד ורמות..." rows="4"></textarea>
<div class="input-actions"><span class="hint">Enter לשליחה</span><button class="build-btn" id="buildBtn" onclick="build()">בנה</button></div>
</div>
<div class="templates">
<button class="tpl-btn" onclick="useTpl('snake')">🐍 Snake</button>
<button class="tpl-btn" onclick="useTpl('todo')">✅ Todo</button>
<button class="tpl-btn" onclick="useTpl('calc')">🔢 מחשבון</button>
<button class="tpl-btn" onclick="useTpl('timer')">⏱️ טיימר</button>
<button class="tpl-btn" onclick="useTpl('quiz')">❓ חידון</button>
</div>
<div class="progress" id="progress">
<div class="progress-bars"><div class="pbar" id="pb1"></div><div class="pbar" id="pb2"></div><div class="pbar" id="pb3"></div><div class="pbar" id="pb4"></div></div>
<div class="progress-text" id="progressText">מנתח...</div>
</div>
<div class="result" id="result">
<div class="result-header"><span class="result-title">✨ הקוד מוכן</span>
<div class="result-actions"><button onclick="copyCode()">העתק</button><button onclick="downloadCode()">הורד</button><button onclick="togglePreview()">תצוגה</button><button onclick="toggleIterate()">שפר</button></div></div>
<div class="code-box"><pre id="codeOut"></pre></div>
<div class="preview" id="preview"><iframe id="previewFrame" sandbox="allow-scripts"></iframe></div>
<div class="iterate-box" id="iterateBox"><input id="iterateInput" placeholder="מה לשפר?"><button onclick="iterate()">שפר</button></div>
</div>
</div>
<div class="modal-bg" id="settingsModal">
<div class="modal"><h2>הגדרות</h2>
<label>NVIDIA API Key</label><input type="password" id="apiKeyInput" placeholder="nvapi-...">
<label>מודל</label><select id="modelSelect"><option value="meta/llama-3.3-70b-instruct">Llama 3.3 70B</option><option value="meta/llama-3.1-8b-instruct">Llama 3.1 8B</option><option value="deepseek-ai/deepseek-coder-6.7b-instruct">DeepSeek Coder</option></select>
<button class="modal-save" onclick="saveSettings()">שמור</button>
<button class="modal-close" onclick="closeSettings()">סגור</button></div></div>
<div class="toast" id="toast"></div>
<script>
var GW="https://promptforge.rabotatony.workers.dev";
var code="";
var building=false;
function getKey(){return localStorage.getItem("pf_key")||""}
function getModel(){return localStorage.getItem("pf_model")||"meta/llama-3.3-70b-instruct"}
function openSettings(){document.getElementById("apiKeyInput").value=getKey();document.getElementById("settingsModal").classList.add("show")}
function closeSettings(){document.getElementById("settingsModal").classList.remove("show")}
function saveSettings(){var k=document.getElementById("apiKeyInput").value.trim();var m=document.getElementById("modelSelect").value;if(k)localStorage.setItem("pf_key",k);localStorage.setItem("pf_model",m);closeSettings();toast("נשמר")}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
function useTpl(name){var tpls={snake:"בנה משחק snake עם ניקוד ורמות",todo:"בנה אפליקציית todo עם הוספה ומחיקה",calc:"בנה מחשבון עם 4 פעולות",timer:"בנה טיימר עם ספירה לאחור",quiz:"בנה חידון עם 5 שאלות"};if(tpls[name]){document.getElementById("task").value=tpls[name];toast("תבנית נטענה")}}
function setStep(n,text){for(var i=1;i<=4;i++){var bar=document.getElementById("pb"+i);bar.className="pbar"+(i<n?" done":i===n?" active":"")}document.getElementById("progressText").textContent=text}
document.getElementById("task").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();build()}});
function build(){
var task=document.getElementById("task").value.trim();
if(!task){toast("כתוב מה לבנות");return}
var key=getKey();
if(!key){openSettings();toast("הכנס API key");return}
if(building)return;
building=true;
document.getElementById("buildBtn").disabled=true;
document.getElementById("progress").classList.add("show");
document.getElementById("result").classList.remove("show");
setStep(1,"מנתח...");
fetch(GW+"/api/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,apiKey:key})})
.then(function(r){return r.json()})
.then(function(pd){
if(pd.error){toast(pd.error);reset();return}
setStep(2,"מתכנן...");
setTimeout(function(){
setStep(3,"בונה...");
fetch(GW+"/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,plan:pd.plan||"",apiKey:key})})
.then(function(r){return r.json()})
.then(function(bd){
if(bd.error){toast(bd.error);reset();return}
code=bd.code||"";
setStep(4,"בודק...");
setTimeout(function(){
document.getElementById("progress").classList.remove("show");
document.getElementById("codeOut").textContent=code;
document.getElementById("result").classList.add("show");
if(code.indexOf("<!DOCTYPE")!==-1||code.indexOf("<html")!==-1){
document.getElementById("preview").classList.add("show");
document.getElementById("previewFrame").srcdoc=code;
}
toast("מוכן!");
reset();
},300);
}).catch(function(e){toast("שגיאה");reset()});
},300);
}).catch(function(e){toast("שגיאה");reset()});
}
function reset(){building=false;document.getElementById("buildBtn").disabled=false}
function copyCode(){navigator.clipboard.writeText(code).then(function(){toast("הועתק")})}
function downloadCode(){var ext=code.indexOf("<html")!==-1?"html":"js";var b=new Blob([code],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="output."+ext;a.click();toast("ירד")}
function togglePreview(){var p=document.getElementById("preview");p.classList.toggle("show");if(p.classList.contains("show"))document.getElementById("previewFrame").srcdoc=code}
function toggleIterate(){document.getElementById("iterateBox").classList.toggle("show")}
function iterate(){
var instruction=document.getElementById("iterateInput").value.trim();
if(!instruction||!code)return;
var key=getKey();
toast("משפר...");
fetch(GW+"/api/iterate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,instruction:instruction,apiKey:key})})
.then(function(r){return r.json()})
.then(function(d){
if(d.error){toast(d.error);return}
code=d.code||"";
document.getElementById("codeOut").textContent=code;
if(code.indexOf("<!DOCTYPE")!==-1||code.indexOf("<html")!==-1)document.getElementById("previewFrame").srcdoc=code;
document.getElementById("iterateInput").value="";
toast("שופר");
}).catch(function(e){toast("שגיאה")});
}
if(!getKey())setTimeout(function(){toast("לחץ על הגלגל והכנס API key")},1000);
</script>
</body>
</html>
