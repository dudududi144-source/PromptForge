<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptForge</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--surface:#ffffff;--border:#e5e5e5;--text:#1a1a2e;--text2:#6b7280;--accent:#2563eb;--accent2:#1d4ed8}
body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:60px 24px}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:48px}
.logo .name{font-size:1rem;font-weight:700;color:var(--text)}
.logo .settings{margin-right:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1rem;padding:6px;border-radius:6px}
.logo .settings:hover{color:var(--text);background:#f3f4f6}
h1{font-size:2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.sub{color:var(--text2);font-size:.95rem;margin-bottom:40px}
.input-area{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;transition:all .2s}
.input-area:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.input-area textarea{width:100%;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:1rem;padding:14px 16px;resize:none;min-height:70px;line-height:1.6}
.input-area textarea::placeholder{color:#9ca3af}
.input-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--border)}
.input-bar .hint{font-size:.75rem;color:var(--text2)}
.go-btn{background:var(--accent);color:#fff;border:none;padding:8px 24px;border-radius:8px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.go-btn:hover{background:var(--accent2)}
.go-btn:disabled{opacity:.5;cursor:wait}
.steps{margin-top:28px;display:none}
.steps.show{display:block}
.step{display:flex;align-items:flex-start;gap:12px;padding:10px 0;opacity:0;transform:translateY(6px);transition:all .3s}
.step.visible{opacity:1;transform:translateY(0)}
.step .dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;background:#f3f4f6;border:1px solid var(--border);color:var(--text2)}
.step.active .dot{background:rgba(37,99,235,0.1);border-color:var(--accent);color:var(--accent)}
.step.done .dot{background:rgba(16,185,129,0.1);border-color:#10b981;color:#10b981}
.step .title{font-size:.85rem;font-weight:600}
.step .desc{font-size:.75rem;color:var(--text2)}
.step.active .title{color:var(--accent)}
.output{margin-top:28px;display:none}
.output.show{display:block}
.output-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.output-header h3{font-size:.95rem;font-weight:600}
.output-actions{display:flex;gap:6px}
.output-actions button{background:#f3f4f6;border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;font-family:inherit;font-size:.75rem;cursor:pointer}
.output-actions button:hover{color:var(--text);border-color:var(--text2)}
.code-box{background:#1e1e2e;border-radius:10px;padding:16px;max-height:450px;overflow:auto;direction:ltr;text-align:left}
.code-box pre{font-family:"Cascadia Code","Fira Code",monospace;font-size:.8rem;line-height:1.7;color:#cdd6f4;white-space:pre-wrap;word-break:break-word}
.preview{margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.preview iframe{width:100%;height:380px;border:none}
.preview-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#f9fafb;border-bottom:1px solid var(--border);font-size:.75rem;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(2px);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:90%;max-width:400px}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:16px}
.modal label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px;margin-top:14px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:.85rem;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .save{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.modal .close{width:100%;margin-top:6px;background:none;border:1px solid var(--border);color:var(--text2);padding:9px;border-radius:8px;font-family:inherit;font-size:.85rem;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:#fff;padding:8px 18px;border-radius:8px;font-size:.8rem;z-index:200;transition:all .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.iterate-area{margin-top:16px;display:none}
.iterate-area.show{display:block}
.iterate-area input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;margin-bottom:8px}
.iterate-area input:focus{border-color:var(--accent)}
@media(max-width:600px){h1{font-size:1.6rem}.wrap{padding:32px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span>⚡</span><span class="name">PromptForge</span><button class="settings" onclick="openSettings()">⚙️</button></div>
  <h1>מה ה-task שלך?</h1>
  <p class="sub">כתוב. לחץ. קבל תוכנית + קוד עובד.</p>
  <div class="input-area">
    <textarea id="task" placeholder="למשל: משחק snake עם ניקוד ורמות..." rows="3"></textarea>
    <div class="input-bar"><span class="hint">Enter לשליחה</span><button class="go-btn" id="goBtn" onclick="go()">🚀 תן לי תוכנית</button></div>
  </div>
  <div class="steps" id="steps">
    <div class="step" id="s1"><div class="dot">1</div><div><div class="title">מנתח</div><div class="desc" id="s1d"></div></div></div>
    <div class="step" id="s2"><div class="dot">2</div><div><div class="title">מתכנן</div><div class="desc" id="s2d"></div></div></div>
    <div class="step" id="s3"><div class="dot">3</div><div><div class="title">בונה</div><div class="desc" id="s3d"></div></div></div>
    <div class="step" id="s4"><div class="dot">4</div><div><div class="title">בודק</div><div class="desc" id="s4d"></div></div></div>
  </div>
  <div class="output" id="output">
    <div class="output-header"><h3>✨ מוכן</h3><div class="output-actions"><button onclick="copyCode()">📋 העתק</button><button onclick="downloadCode()">💾 הורד</button><button onclick="togglePreview()">👁️ תצוגה</button><button onclick="showIterate()">✏️ שפר</button></div></div>
    <div class="code-box"><pre id="codeOut"></pre></div>
    <div class="preview" id="previewBox" style="display:none"><div class="preview-bar"><span>Live Preview</span><button onclick="togglePreview()" style="background:none;border:none;cursor:pointer;color:var(--text2)">✕</button></div><iframe id="previewFrame" sandbox="allow-scripts"></iframe></div>
    <div class="iterate-area" id="iterateArea"><input id="iterateInput" placeholder="מה לשפר? למשל: תוסיף dark mode"><button class="go-btn" onclick="iterate()" style="width:100%">🔧 שפר</button></div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal"><h3>⚙️ הגדרות</h3><label>NVIDIA API Key</label><input type="password" id="apiKeyInput" placeholder="nvapi-..."><label>מודל</label><input type="text" id="modelInput" value="meta/llama-3.3-70b-instruct"><button class="save" onclick="saveSettings()">שמור</button><button class="close" onclick="closeSettings()">סגור</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
var GW="https://promptforge.rabotatony.workers.dev";
var generatedCode="",isBuilding=false;
function getKey(){return localStorage.getItem("pf_key")||""}
function getModel(){return localStorage.getItem("pf_model")||"meta/llama-3.3-70b-instruct"}
function openSettings(){document.getElementById("apiKeyInput").value=getKey();document.getElementById("modelInput").value=getModel();document.getElementById("settingsModal").classList.add("show")}
function closeSettings(){document.getElementById("settingsModal").classList.remove("show")}
function saveSettings(){var k=document.getElementById("apiKeyInput").value.trim();var m=document.getElementById("modelInput").value.trim();if(k)localStorage.setItem("pf_key",k);if(m)localStorage.setItem("pf_model",m);closeSettings();showToast("✅ נשמר")}
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2500)}
function setStep(n,state){document.getElementById("s"+n).className="step visible "+state}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
document.getElementById("task").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}})
async function go(){
  var task=document.getElementById("task").value.trim();
  if(!task){showToast("כתוב מה אתה רוצה לבנות");return}
  var key=getKey();
  if(!key){openSettings();showToast("הכנס API key");return}
  if(isBuilding)return;
  isBuilding=true;
  document.getElementById("goBtn").disabled=true;
  document.getElementById("goBtn").textContent="בונה...";
  document.getElementById("steps").classList.add("show");
  document.getElementById("output").classList.remove("show");
  ["s1","s2","s3","s4"].forEach(function(s){document.getElementById(s).className="step"})
  try{
    setStep(1,"active");
    document.getElementById("s1d").textContent="מנתח סיבוכות...";
    var planResp=await fetch(GW+"/api/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,apiKey:key})});
    var planData=await planResp.json();
    if(planData.error){document.getElementById("s1d").textContent="❌ "+planData.error;showToast("❌ "+planData.error);resetBtn();return}
    document.getElementById("s1d").textContent="סיבוכות: "+(planData.analysis?planData.analysis.complexity:"?");
    setStep(1,"done");
    setStep(2,"active");
    document.getElementById("s2d").textContent="יוצר תוכנית פעולה...";
    await sleep(400);
    document.getElementById("s2d").textContent="תוכנית מוכנה";
    setStep(2,"done");
    setStep(3,"active");
    document.getElementById("s3d").textContent="כותב קוד...";
    var buildResp=await fetch(GW+"/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,plan:planData.plan||"",apiKey:key})});
    var buildData=await buildResp.json();
    if(buildData.error){document.getElementById("s3d").textContent="❌ "+buildData.error;showToast("❌ "+buildData.error);resetBtn();return}
    generatedCode=buildData.code||"";
    document.getElementById("s3d").textContent=generatedCode.split("\n").length+" שורות · "+(buildData.tokens||0)+" tokens";
    setStep(3,"done");
    setStep(4,"active");
    document.getElementById("s4d").textContent="בודק...";
    await sleep(300);
    var vText="✅ תקין";
    if(buildData.validation&&!buildData.validation.valid)vText="⚠️ "+(buildData.validation.issues||[]).join(", ");
    document.getElementById("s4d").textContent=vText;
    setStep(4,"done");
    await sleep(200);
    document.getElementById("codeOut").textContent=generatedCode;
    document.getElementById("output").classList.add("show");
    if(generatedCode.indexOf("<!DOCTYPE")!==-1||generatedCode.indexOf("<html")!==-1){document.getElementById("previewBox").style.display="block";document.getElementById("previewFrame").srcdoc=generatedCode}
    showToast("✨ מוכן!");
  }catch(e){showToast("❌ "+e.message)}
  resetBtn();
}
function resetBtn(){isBuilding=false;document.getElementById("goBtn").disabled=false;document.getElementById("goBtn").textContent="🚀 תן לי תוכנית"}
function copyCode(){navigator.clipboard.writeText(generatedCode).then(function(){showToast("📋 הועתק!")})}
function downloadCode(){var ext=generatedCode.indexOf("<html")!==-1?"html":"js";var b=new Blob([generatedCode],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="output."+ext;a.click();showToast("💾 ירד!")}
function togglePreview(){var f=document.getElementById("previewBox");if(f.style.display==="none"){f.style.display="block";document.getElementById("previewFrame").srcdoc=generatedCode}else f.style.display="none"}
function showIterate(){var a=document.getElementById("iterateArea");a.classList.toggle("show")}
async function iterate(){
  var instruction=document.getElementById("iterateInput").value.trim();
  if(!instruction){showToast("כתוב מה לשפר");return}
  var key=getKey();
  if(!key){openSettings();return}
  if(!generatedCode){showToast("אין קוד לשפר");return}
  showToast("⏳ משפר...");
  try{
    var resp=await fetch(GW+"/api/iterate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:generatedCode,instruction:instruction,apiKey:key})});
    var data=await resp.json();
    if(data.error){showToast("❌ "+data.error);return}
    generatedCode=data.code||"";
    document.getElementById("codeOut").textContent=generatedCode;
    if(generatedCode.indexOf("<!DOCTYPE")!==-1||generatedCode.indexOf("<html")!==-1){document.getElementById("previewFrame").srcdoc=generatedCode}
    document.getElementById("iterateInput").value="";
    showToast("✅ שופר!");
  }catch(e){showToast("❌ "+e.message)}
}
if(!getKey())setTimeout(function(){showToast("⚙️ לחץ על הגלגל והכנס API key")},1500);
</script>
</body>
</html>
